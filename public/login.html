<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playlite · Sign in</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login { width: min(380px, 100%); display: grid; gap: 16px; }
    .login .brand { justify-content: center; font-size: 1.5rem; margin-bottom: 4px; }
    .login .logo svg { width: 40px; height: 40px; }
    .login form { display: grid; gap: 12px; }
    .login input { width: 100%; padding: 10px 12px; }
    .login .btn { padding: 10px; font-size: 1rem; }
    .err { color: var(--bad); font-size: 0.9rem; min-height: 1.2em; margin: 0; }
  </style>
</head>
<body>
  <div class="login">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14"/><path d="M13 10l9 6-9 6z"/></svg></span>
      <span>Playlite</span>
    </div>
    <div class="card">
      <h2 id="title">Sign in</h2>
      <p class="sub" id="subtitle">Your home, your rules.</p>
      <form id="form">
        <label class="field">Username<input id="username" autocomplete="username" required autofocus></label>
        <label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label>
        <label class="field" id="confirm-wrap" hidden>Confirm password<input id="confirm" type="password" autocomplete="new-password"></label>
        <p class="err" id="err" role="alert"></p>
        <button class="btn primary" id="go">Sign in</button>
      </form>
    </div>
  </div>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const { hasUsers } = await fetch('/api/auth/status').then((r) => r.json());
    if (!hasUsers) {
      $('title').textContent = 'Create your account';
      $('subtitle').textContent = 'First time here — pick a username and password for Playlite.';
      $('confirm-wrap').hidden = false;
      $('password').autocomplete = 'new-password';
      $('go').textContent = 'Create account';
    }
    $('form').onsubmit = async (e) => {
      e.preventDefault();
      $('err').textContent = '';
      if (!hasUsers && $('password').value !== $('confirm').value) {
        $('err').textContent = "Passwords don't match";
        return;
      }
      $('go').disabled = true;
      const res = await fetch(hasUsers ? '/api/auth/login' : '/api/auth/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: $('username').value, password: $('password').value }),
      });
      const data = await res.json().catch(() => ({}));
      $('go').disabled = false;
      if (!res.ok) {
        $('err').textContent = data.error ?? 'Something went wrong';
        return;
      }
      location.href = '/';
    };
  </script>
</body>
</html>
